# Illustrative policy example.
# Not an implemented protocol, medical specification, or safety certification.

spec_version: "0.1-draft"

policy_id: "cog.example.motor-assist"
policy_version: "1"

issuer:
  id: "user-policy-root"
  key_id: "key-2026-01"

principal:
  id: "personal-ai"
  type: "ai_agent"

capability:
  action: "propose_actuation"

resource:
  type: "neural_target"
  id: "motor-interface-1"

purpose: "motor_assistance"

constraints:
  - claim: "request.parameters.mode"
    op: "in"
    value:
      - "assist"
      - "rehabilitation"

not_before: "2026-01-01T00:00:00Z"
expires_at: "2027-01-01T00:00:00Z"

required_approvals:
  mode: "all"
  principals:
    - "user-policy"
    - "safety-controller"

attestation_requirements:
  - claim: "device.secure_boot"
    op: "eq"
    value: true

audit_requirements:
  mandatory: true
  sink_required_for_allow: true

revocation_conditions:
  policy_must_be_active: true
  principal_must_be_active: true
  issuer_key_must_be_active: true
